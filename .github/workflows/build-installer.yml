name: Build Windows installer

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare installer staging
        shell: powershell
        run: .\\installer\\Prepare-Installer.ps1

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq 'release') {
            $tag = "${{ github.event.release.tag_name }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }

          if ($tag -match '^v(.+)$') {
            $version = $Matches[1]
          } else {
            $version = '0.1.1-beta'
          }

          & "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe" "/DMyAppVersion=$version" ".\\installer\\ChatGPT-RTL.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create SHA-256
        shell: powershell
        run: |
          $exe = Get-ChildItem .\\installer\\output\\*.exe | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content .\\installer\\output\\SHA256SUMS-installer.txt -Encoding ascii
          Get-Content .\\installer\\output\\SHA256SUMS-installer.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            installer/output/*.exe
            installer/output/SHA256SUMS-installer.txt

      - name: Upload installer to GitHub Release
        if: github.event_name == 'release'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          gh release upload $tag .\\installer\\output\\*.exe .\\installer\\output\\SHA256SUMS-installer.txt --clobber
