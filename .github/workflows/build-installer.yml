name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare installer staging
        shell: powershell
        run: .\installer\Prepare-Installer.ps1

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: powershell
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" ".\installer\ChatGPT-RTL.iss"'

      - name: Create SHA-256
        shell: powershell
        run: |
          $exe = Get-ChildItem .\installer\output\*.exe | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content .\installer\output\SHA256SUMS-installer.txt -Encoding ascii
          Get-Content .\installer\output\SHA256SUMS-installer.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            installer/output/*.exe
            installer/output/SHA256SUMS-installer.txt

      - name: Publish assets to tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes-file RELEASE_NOTES_v0.1.0-beta.md
          }
          gh release upload $tag .\installer\output\*.exe .\installer\output\SHA256SUMS-installer.txt --clobber
